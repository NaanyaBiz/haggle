name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: every job only reads the tree (checkout) and, for
# dependency-review, the dependency graph — both covered by contents: read.
# (zizmor excessive-permissions gate rejects blanket read-all.)
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Verify uv.lock is in sync with pyproject.toml
        # Must run BEFORE `uv sync`: a non-frozen sync silently rewrites a
        # stale lock on disk and would mask the drift (this is exactly how a
        # Dependabot pyproject-only floor bump slipped a stale lock past CI,
        # #185). `uv lock --check` errors if uv.lock and pyproject.toml disagree.
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check custom_components/ tests/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check custom_components/ tests/ scripts/

      - name: Mypy
        run: uv run mypy custom_components/haggle

      # shellcheck + actionlint run through pre-commit so CI and local
      # commits use the SAME frozen-SHA hook revs (anti-drift rule at the
      # top of .pre-commit-config.yaml). zizmor comes from uv.lock.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Shellcheck (pinned pre-commit rev)
        run: uv run pre-commit run shellcheck --all-files

      - name: Actionlint (pinned pre-commit rev)
        run: uv run pre-commit run actionlint --all-files

      - name: Zizmor workflow audit (uv.lock version)
        run: uv run zizmor --offline --min-severity medium .github/workflows/

      # Coverage is reported inline via --cov-report=term-missing (pyproject
      # addopts). No external coverage vendor: the Codecov upload was
      # write-only (no badge, no consumer) and third-party code on every PR
      # is surface we don't need (2026-07 dependency review).
      # --cov-fail-under lives HERE, not in pyproject addopts, so local
      # single-file runs (uv run pytest tests/test_parser.py) stay usable —
      # a subset run computes low coverage by construction and would always
      # trip an addopts-level floor. Current combined (lines+branches) total:
      # 90.0% on 2026-07-13. Floor 89 = regression gate with ~1pt headroom.
      # Ratchet UP as the total rises; never lower it to make a PR pass.
      - name: Pytest
        run: uv run pytest --cov-fail-under=89

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history — the scan covers every commit
          persist-credentials: false

      # Checksum-pinned release binary rather than gitleaks/gitleaks-action:
      # stricter than a SHA-pinned action (the action downloads the gitleaks
      # binary at runtime by mutable version tag), zero third-party action
      # code, and the version matches the pre-commit hook rev — update BOTH
      # together (pre-commit autoupdate --freeze + bump this URL/checksum).
      - name: Install gitleaks v8.30.1 (checksum-pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Self-test: prove the scanner detects before trusting its verdict.
      # A scanner that silently matches nothing (the failure mode alleged —
      # and refuted — in gitleaks#2170, but real for any broken build) must
      # fail this job, never greenlight the history scan. The seeded value
      # is assembled at runtime so the workflow source itself can't match
      # the github-pat rule.
      - name: Scanner self-test (must detect seeded token)
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-selftest"
          printf 'token = "ghp_%s"\n' "Xk92mQfR7vLpTz3NwYbJc5HdGs81uEaMnB4o" \
            > "$RUNNER_TEMP/gitleaks-selftest/seed.txt"
          if "$RUNNER_TEMP/gitleaks" dir --no-banner --redact "$RUNNER_TEMP/gitleaks-selftest"; then
            echo "::error::gitleaks did not detect the seeded token — scanner silently broken; history scan verdict is untrustworthy"
            exit 1
          fi
          echo "self-test OK: seeded token detected"

      # Second self-test: prove THIS PR's custom rules still match
      # everything they were written to catch (#248). The step above only
      # proves the binary is alive — it seeds a built-in pattern into a
      # scratch dir with no config, so a PR that narrowed a regex in
      # .gitleaks.toml passed it every time.
      #
      # Each seed is its own file and each (rule, file) pair is asserted,
      # because coarser checks miss real regressions (both verified):
      #   - "did anything fire" — a weakened custom rule lets a DEFAULT
      #     rule match the same seed, keeping the finding count identical.
      #   - one seed per rule — the identifier rules span \d{6,12} and the
      #     URL rule covers Electricity, ElectricitySolar and plan/energy,
      #     so a single 10-digit Electricity seed stays green while
      #     narrowing to \d{10} or dropping the Solar branch blinds the
      #     scanner to real secrets. Seeds cover both length boundaries and
      #     every protected alternative.
      # Seeds are built at runtime so this workflow cannot match the rules.
      - name: Custom-rule self-test (must detect repo-specific patterns)
        run: |
          d="$RUNNER_TEMP/gitleaks-customrules"
          report="$RUNNER_TEMP/customrules.json"
          mkdir -p "$d"
          printf 'refresh_token = "%s"\n' \
            "v1.u8jzPde0IgxLd6GncfBAepfJBd0Kh8oOOL8dKLzdocJ2isAjIhKtJ0Rlg" > "$d/tok-min.txt"
          printf 'accountNumber = "%s"\n' "482057" > "$d/id-6.txt"
          printf 'contract_number = "%s"\n' "482057193641" > "$d/id-12.txt"
          printf 'GET /mobile/bff/api/v2/usage/smart/Electricity/%s/Current/Hourly\n' \
            "4820571936" > "$d/url-elec.txt"
          printf 'GET /mobile/bff/api/v2/usage/smart/ElectricitySolar/%s/Current/Hourly\n' \
            "482057" > "$d/url-solar.txt"
          printf 'GET /mobile/bff/api/v2/plan/energy/%s\n' "482057193641" > "$d/url-plan.txt"
          printf 'haggle:consumption_%s\n' "482057" > "$d/stat-6.txt"
          printf 'haggle:generation_credit_%s\n' "482057193641" > "$d/stat-12.txt"

          # gitleaks exits 1 both when it finds leaks (expected here) and on
          # a fatal config error, so the exit code cannot tell them apart —
          # but a fatal error writes NO report. Discriminate on that, or a
          # .gitleaks.toml syntax error in the PR reports as a pile of
          # misleading "rule did not fire" lines and sends triage hunting
          # regexes.
          set +e
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact \
            --config .gitleaks.toml \
            --report-format json --report-path "$report" "$d"
          status=$?
          set -e
          if [ ! -s "$report" ] || ! jq -e 'type == "array"' "$report" > /dev/null 2>&1; then
            echo "::error::gitleaks wrote no usable report (exit $status) — .gitleaks.toml parse error or broken binary, NOT a rule regression"
            exit 1
          fi

          missing=0
          for pair in \
            auth0-opaque-refresh-token:tok-min.txt \
            agl-real-customer-identifier:id-6.txt \
            agl-real-customer-identifier:id-12.txt \
            agl-contract-in-usage-url:url-elec.txt \
            agl-contract-in-usage-url:url-solar.txt \
            agl-contract-in-usage-url:url-plan.txt \
            agl-contract-in-statistic-id:stat-6.txt \
            agl-contract-in-statistic-id:stat-12.txt; do
            rule="${pair%%:*}"
            seed="${pair##*:}"
            if ! jq -e --arg r "$rule" --arg f "$seed" \
                 'any(.[]; .RuleID == $r and (.File | endswith($f)))' "$report" > /dev/null; then
              echo "::error::.gitleaks.toml rule '$rule' did not fire on seed '$seed' — the rule was weakened, removed, or allowlisted away"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "custom-rule self-test OK: every rule fired on every seeded variant"

      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact .'

  dependency-review:
    name: Dependency review
    # PR-only: the action diffs base..head dependency manifests; push events
    # to main have no base ref. WP1 makes this a required PR check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review (vulnerabilities + licence gate)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          vulnerability-check: true
          license-check: true
          # Explicit, not default (default blocks runtime scope only).
          # GitHub currently classifies uv.lock deps as runtime scope
          # (verified on this PR's snapshot), so the default happens to
          # cover us today — pinning all three scopes removes the
          # dependence on that classification behaviour.
          fail-on-scopes: runtime, development, unknown
          # Apache-2.0 repo shipping ZERO third-party code: haggle.zip is
          # custom_components/haggle/ only (manifest.json requirements: []),
          # so no dependency is ever redistributed and plain-copyleft
          # obligations cannot arise. The whole estate is dev/CI-only.
          #
          # Network copyleft ONLY (PR #263). Plain GPL removed 2026-09-09:
          # the tree carries three GPL-3.0 packages transitively from
          # homeassistant — hass-nabucasa, its own dependency snitun, and
          # pyric — none of which this project can drop or redistribute.
          # The old denylist blocked exactly one of the three, because
          # hass-nabucasa declares SPDX `license_expression` while the other
          # two declare only a legacy classifier the action does not
          # normalise (#262). Blocking a parent while admitting its child
          # was incoherent, and it fired on metadata format rather than
          # licence. AGPL/SSPL are kept: they carry genuinely surprising
          # obligations, appear nowhere in the current tree, and would be a
          # real signal if they showed up.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
